name: my-devenv-recipe-development
services:
  dev:
    build:
      context: .devcontainer
      dockerfile: dev.Dockerfile
      args:
        USERNAME: developer
    command: [ "sleep", "infinity" ]
    volumes:
      - .:/workspace:cached
      - ${HOME}/.gitconfig:/home/developer/.gitconfig:ro
      - ${HOME}/.claude:/home/developer/.claude:cached
    environment:
      XDG_CACHE_HOME: /workspace/.devcontainer/.cache
    labels:
      traefik.enable: true
      traefik.http.routers.app.rule: "Host(`app.localhost`)"
      traefik.http.routers.app.entrypoints: web
      traefik.http.routers.app.service: app
      traefik.http.services.app.loadbalancer.server.port: 8000
  db:
    environment:
      POSTGRES_PASSWORD: password
  proxy:
    command: 
      - "--api=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`my-devenv-recipe-development`)"

  app: !reset null
