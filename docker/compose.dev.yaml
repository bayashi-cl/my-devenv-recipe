name: my-devenv-recipe-dev

services:
  api: !reset null
  web: !reset null
  proxy:
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`my-devenv-recipe-dev`)"
      # labels はコンテナ作成時に固定されるため、worktree のように動的に増減する
      # ルートは扱えない。dev コンテナ内の scripts/worktree.sh が生成する YAML を
      # file provider が監視することで、コンテナを作り直さずにルートを増減させる。
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro

  dev:
    build:
      context: docker/dev
      dockerfile: Dockerfile
    command: sleep infinity
    environment:
      XDG_CACHE_HOME: /workspace/my-devenv-recipe/.cache
      # Claude Code の設定・認証情報を丸ごと claude-cache ボリューム内に集約する。
      # 認証トークンの .credentials.json はもともと ~/.claude に置かれ永続化されて
      # いたが、アカウント・オンボーディング状態を持つ ~/.claude.json はホーム直下
      # （ボリューム外）にあり、コンテナ recreate で失われて再認証が必要になっていた。
      # CLAUDE_CONFIG_DIR を永続化済みの ~/.claude に向けると .claude.json も同ディレ
      # クトリ配下に作られ、recreate をまたいで認証が維持される。
      CLAUDE_CONFIG_DIR: /home/developer/.claude
      # 実行時設定（FRONTEND_ORIGIN / API_BASE_URL / DATABASE_URL / ポート）は
      # チェックアウトごとの .env.worktree が持つ。ここに書くと全 worktree で
      # 同じ値が共有されてしまううえ、--env-file は既存の環境変数を上書きしないため
      # worktree 側の設定が無視される。
      DOMAIN: "${DOMAIN}"
      # worktree ごとの DB を dev コンテナから作成・削除するための接続情報。
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: postgres
    labels:
      traefik.enable: true
      traefik.http.routers.api.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.service: api
      traefik.http.services.api.loadbalancer.server.port: "8000"
      traefik.http.routers.web.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.web.entrypoints: "web"
      traefik.http.routers.web.service: web
      traefik.http.services.web.loadbalancer.server.port: "3000"
    volumes:
      - .:/workspace/my-devenv-recipe:cached
      - claude-cache:/home/developer/.claude

volumes:
  claude-cache:
    name: my-devenv-recipe-dev_claude-cache
