name: my-devenv-recipe-dev

services:
  api: !reset null
  web: !reset null
  proxy:
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=LabelRegex(`com.docker.compose.project`,`my-devenv-recipe-dev.*`)"
    ports: !override
      - "127.0.0.1:8080:80"

  dev:
    build:
      context: docker/dev
      dockerfile: Dockerfile
    command: sleep infinity
    environment:
      XDG_CACHE_HOME: /workspace/my-devenv-recipe/.cache
    #   DATABASE_URL: postgresql://postgres:password@db:5432/postgres
    labels:
      traefik.enable: true
      traefik.http.routers.api.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.service: api
      traefik.http.services.api.loadbalancer.server.port: "8000"
      traefik.http.routers.web.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.web.entrypoints: "web"
      traefik.http.routers.web.service: web
      traefik.http.services.web.loadbalancer.server.port: "3000"
    volumes:
      - .:/workspace/my-devenv-recipe:cached
      - claude-cache:/home/developer/.claude

volumes:
  claude-cache:
    name: my-devenv-recipe-dev_claude-cache
